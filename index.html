<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdminExpress | Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <aside class="brand">
    <h1 class="brand__name">AdminExpress</h1>
  </aside>

  <main class="login">

    <header class="login__header">
      <h2 class="login__title">Let's Sign In <span class="wave">👋</span></h2>
      <p class="login__subtitle">Hey, Enter your details to get sign in to your account.</p>
    </header>

    <form class="login__form" autocomplete="off">

      <label for="email" class="field field--email">
        Email
        <input type="email" id="email" name="email" placeholder="Enter Email" required>
      </label>

      <label for="password" class="field field--password">
        Password
        <input type="password" id="password" name="password" placeholder="Enter Password" required>
      </label>

      <a href="#" class="forgot">Forgot password?</a>

      <button type="submit" class="submit">Sign In</button>

    </form>

    <footer class="login__footer">
      <p>Don't have an account? <a href="#">Sign Up</a></p>
    </footer>

  </main>

</body>
</html>
